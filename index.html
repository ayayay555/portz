<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karl Gonzales | AI Automation Engineer</title>
    <meta name="description" content="AI automation engineer. 100+ automations and 13 systems across law, e-commerce, plumbing, HVAC and web agencies." />
    <script>
      // Apply a saved theme before first paint, so the page never flashes the wrong one.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
